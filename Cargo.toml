[package]
name = "vimanam"
version = "2.2.0"
edition = "2024"
rust-version = "1.96"
authors = ["Narayan SS <nrynss@users.noreply.github.com>"]
description = "OpenAPI/Swagger to Markdown documentation generator with grouping, filtering, and detail levels for docs and LLM context"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/noemaforge/vimanam"
homepage = "https://github.com/noemaforge/vimanam"
keywords = ["openapi", "swagger", "markdown", "documentation", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vimanam"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli/main.rs"
required-features = ["cli"]

[[test]]
name = "split"
path = "tests/split.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:clap_complete_nushell",
    "dep:clap_mangen",
    "dep:env_logger",
]

[dependencies]
# Command line argument parsing
clap = { version = "4.6", features = ["derive", "wrap_help"], optional = true }
# Shell completion generation for the `completions` subcommand
clap_complete = { version = "4.6", optional = true }
clap_complete_nushell = { version = "4.6", optional = true }
# Manual page generation for the `man` subcommand
clap_mangen = { version = "0.3", optional = true }

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps serde_json::Value object keys in spec order, so the
# OpenAPI 2.0 `securityDefinitions` (read via the extensions map) and `$ref`
# resolution preserve declaration order rather than sorting alphabetically.
serde_json = { version = "1.0", features = ["preserve_order"] }
# Pure-Rust, unsafe-free YAML 1.2 deserializer with parsing budgets (#4)
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }

# Insertion-order-preserving maps for deterministic output
indexmap = { version = "2.14", features = ["serde"] }

# Error handling
anyhow = "1.0"

# SHA-256 for the diff JSON `file_sha256` fields and stable change IDs (#98)
sha2 = "0.11"

# Logging
log = "0.4"
env_logger = { version = "0.11", optional = true }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
# Pure-Rust .proto source compiler for the Protobuf adapter (#126)
protox = { version = "0.10", default-features = false }
# GraphQL SDL and literal parsing for the GraphQL adapter (#125)
apollo-parser = "0.8"

[dev-dependencies]
# Testing
assert_cmd = "2.2"
predicates = "3.1"
serde-saphyr = { version = "2.2", default-features = false, features = ["serialize"] }
tempfile = "3.27"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
