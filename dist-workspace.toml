# Regenerate with: python3 scripts/generate-release.py
# SHA pins are native dist configuration below. The helper adds the green-CI
# guard before dist planning; dist has no hook for steps before its plan job.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The helper adds the pre-plan guard and preserves crates.io prereleases.
# CI checks the complete output with scripts/generate-release.py --check.
allow-dirty = ["ci"]
# PR packaging checks live in CI and run only for release/configuration changes.
pr-run-mode = "skip"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Publish the Homebrew formula to a self-hosted tap on each release
publish-jobs = ["homebrew", "./publish-crate"]
github-custom-job-permissions = { "publish-crate" = { contents = "read" } }
# Tap repo that receives the generated formula (-> `brew install noemaforge/tap/vimanam`)
tap = "noemaforge/homebrew-tap"
formula = "vimanam"
# Checksum format for release artifacts
checksum = "sha256"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
