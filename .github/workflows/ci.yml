name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Sundays at 00:00 UTC to catch newly published advisories against pinned crates
    - cron: '0 0 * * 0'

permissions:
  contents: read

# Cancel obsolete PR runs, but keep every main commit's release-eligible CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Format, lint, test (stable)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require all actions to be pinned to a full commit SHA
        run: |
          set -euo pipefail
          unpinned="$(grep -rEn '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]' .github/workflows \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE 'uses:[[:space:]]*[^@]+@[0-9a-f]{40}([[:space:]]|"|$)' || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::These actions are not pinned to a full commit SHA:"
            echo "$unpinned"
            exit 1
          fi

      - name: Test release gate
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Detect release configuration changes
        id: release-config
        run: |
          # PR checkout is a merge commit: its first parent is the PR base.
          changed_files="$(git diff --name-only HEAD^ HEAD -- Cargo.toml Cargo.lock dist-workspace.toml .github/workflows scripts/require-green-ci.py scripts/generate-release.py scripts/test_require_green_ci.py)"
          if [ -n "$changed_files" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check release packaging configuration
        if: github.event_name == 'push' || steps.release-config.outputs.changed == 'true'
        shell: bash
        run: |
          DIST_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dist-workspace.toml", "rb"))["dist"]["cargo-dist-version"])')"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
          python3 scripts/generate-release.py --check
          dist plan --output-format=json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-06-20
        with:
          toolchain: stable
          components: rustfmt, clippy

      - run: cargo fmt --check

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pinned protoc without system changes
        run: |
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo '121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278  '"$RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Core library without CLI dependencies
        run: |
          cargo build --locked --lib --no-default-features
          cargo clippy --locked --lib --no-default-features -- -D warnings
          cargo test --locked --no-default-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-default-features --no-deps
          if cargo tree --locked --no-default-features --edges normal --prefix none | grep -E '^(clap|clap_complete|env_logger) '; then
            echo "CLI-only dependency found in the core library graph"
            exit 1
          fi

  msrv:
    name: Build (MSRV 1.96)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-06-20
        with:
          toolchain: "1.96"

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo build --locked

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit dependencies
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
