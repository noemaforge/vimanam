# The protobuf rules: the adapter's classification, the native rule names,
# the composite facts of `protobuf::diff`, and the `--breaking` gate. The
# neutral comparison (`compare`, `diff_values`) is read as far as the
# fragment's attributes need it; the entity and attribute builders of
# `adapt` decide which attributes a fragment change touches.
[[model]]
lean = "formal/VimanamProofs/Protobuf.lean"
