name = "vimanam-proofs"
version = "0.1.0"
defaultTargets = ["VimanamProofs"]

[[lean_lib]]
name = "VimanamProofs"
# Every module under VimanamProofs/, imported or not, so a new model is always
# checked (an unimported one would otherwise be skipped by `lake build`).
globs = ["VimanamProofs", "VimanamProofs.+"]

# The differential oracle: `lake exe oracle` evaluates the model definitions
# over generated inputs and writes formal/oracle/*.json, which
# src/diff/formal_oracle.rs replays against the Rust. Not a default target, so
# `lake build` builds the proofs alone. See README.md, "Differential oracle".
[[lean_lib]]
name = "OracleExport"
globs = ["OracleExport.+"]

[[lean_exe]]
name = "oracle"
root = "OracleExport.Main"

# The `$ref` diff reference model's evaluator: `lake exe refdiff OLD NEW`
# prints the model's grouped and per-path output for one spec pair, which
# scripts/formal/refdiff-harness.py compares with the Rust. See README.md,
# "Reference semantics of `$ref` diffs".
[[lean_exe]]
name = "refdiff"
root = "OracleExport.RefDiffMain"
